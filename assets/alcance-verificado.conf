# alcance-verificado.conf - unico lugar donde se declara lo que se probo DE VERDAD (lib.sh lo carga).
# Fuera de este alcance, install-package.sh y activate-site.sh se niegan salvo que una PERSONA fije ACK_UNTESTED=yes.
# Si este archivo falta o esta vacio, se niega todo (no hay valores de respaldo permisivos).
# Ampliar solo con evidencia: agregar el valor DESPUES de tener resultados registrados en references/12-resultados-de-verificacion.md que lo respalden.
# Fecha de la ultima revision: 2026-10-24

# Combinaciones "<version mayor de RHEL o derivada>:<MM de PHP>" que se instalaron, activaron, cambiaron de version y revirtieron
# con los scripts (VERSION_ID de /etc/os-release). Respaldo: references/12-resultados-de-verificacion.md.
#   CentOS 7.9: PHP 8.2, 8.3, 8.4 y 8.5 (paquetes de build/)      Rocky Linux 9.8: PHP 8.3 y 8.4 (compilados en el propio servidor de prueba)
VERIFIED_COMBOS="7:82 7:83 7:84 7:85 9:83 9:84"

# Distribuciones (campo ID de /etc/os-release) en las que se probo. Otras derivadas de RHEL (almalinux, ol, rhel) son compatibilidad inferida:
# los scripts piden la excepcion de una persona (ACK_UNTESTED=yes) hasta que se pruebe y se agregue aqui.
VERIFIED_DISTROS="centos rocky"

# Versiones mayores probadas con SELinux Enforcing y systemd real: CentOS 7.9 y Rocky 9.8 (references/12-resultados-de-verificacion.md).
SELINUX_ENFORCING_EL_MAJOR="7 9"
